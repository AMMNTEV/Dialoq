<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Мессенджер</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/messenger.css">
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="messenger-container">
    <div class="nav-sidebar">
      <!-- Блок с информацией о пользователе -->
      <div class="nav-user-box">
        <div class="nav-user-info">
          <div class="nav-user-name" id="sidebarUserName">Загрузка...</div>
          <div class="nav-user-tag" id="sidebarUserTag">@загрузка</div>
        </div>
        <div class="nav-user-avatar" id="sidebarUserAvatar"></div>
      </div>

      <!-- Основное меню -->
      <div class="nav-buttons">
        <a href="profile.html" class="nav-button">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Профиль
        </a>
        <a href="messenger.html" class="nav-button">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          Мессенджер
        </a>
        <a href="settings.html" class="nav-button">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Настройки
        </a>
      </div>

      <div class="nav-divider"></div>

      <button onclick="showCreateGroupModal()" class="nav-button">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Создать беседу
      </button>

      <div class="nav-divider"></div>

      <button onclick="logout()" class="nav-button logout-btn">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Выход
      </button>
    </div>

    <div class="chats-sidebar" id="chatsSidebar">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Поиск пользователей и бесед..." onkeyup="searchAll()">
      </div>
      <div class="chats-list" id="chatsList">
        <div class="loading">Загрузка чатов...</div>
      </div>
    </div>

    <div class="chat-area" id="chatArea">
      <div class="chat-header" id="chatHeader">
        <div class="no-chat-selected" id="noChatMessage">Выберите чат для начала общения</div>
      </div>
      <div class="messages-container" id="messagesContainer"></div>
      
      <!-- Поле ввода с иконкой самолетика для отправки -->
      <div class="message-input-area" id="messageInputArea">
        <input type="text" id="messageInput" placeholder="Введите сообщение..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()" id="sendButton" title="Отправить">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Мобильное меню -->
  <button class="mobile-menu-btn" id="mobileMenuBtn" onclick="toggleMobileMenu()">☰</button>
  <div class="sidebar-overlay" id="mobileMenuOverlay" onclick="toggleMobileMenu()"></div>
  <div class="mobile-popup-menu" id="mobilePopupMenu">
    <a href="profile.html" class="popup-item">Мой профиль</a>
    <button onclick="showCreateGroupModal(); toggleMobileMenu()" class="popup-item">+ Беседа</button>
    <button onclick="logout()" class="popup-item logout">Выйти</button>
  </div>

  <!-- Модальное окно создания беседы -->
  <div id="createGroupModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Создать новую беседу</h3>
        <button onclick="hideCreateGroupModal()" class="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <input type="text" id="groupName" placeholder="Название беседы" class="modal-input">
        <div class="group-participants">
          <h4>Выберите участников:</h4>
          <input type="text" id="searchUsersInCreate" placeholder="Поиск пользователей..." class="search-input" onkeyup="searchUsersInCreate()">
          <div id="usersListModal" class="users-checkbox-list">
            <div class="no-users">Начните вводить имя для поиска</div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button onclick="hideCreateGroupModal()" class="modal-cancel-btn">Отмена</button>
        <button onclick="createGroupChat()" class="modal-save-btn">Создать</button>
      </div>
    </div>
  </div>

  <!-- Модальное окно информации о беседе -->
  <div id="groupInfoModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="groupInfoName">Информация о беседе</h3>
        <button onclick="hideGroupInfoModal()" class="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="group-info-section">
          <h4>Участники:</h4>
          <div id="groupParticipants" class="group-participants-list"></div>
          
          <!-- Кнопка выхода из беседы с иконкой стрелки влево (выход) -->
          <button onclick="leaveCurrentGroup()" id="leaveGroupBtn" class="modal-leave-btn" style="display: inline-flex; align-items: center; gap: 8px;">
            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            Покинуть беседу
          </button>
        </div>
        <div class="group-info-section">
          <h4>Добавить участников:</h4>
          <input type="text" id="searchUsersToAdd" placeholder="Поиск пользователей..." class="search-input" onkeyup="searchUsersToAdd()">
          <div id="addParticipantsList" class="users-checkbox-list">
            <div class="no-users">Начните вводить имя для поиска</div>
          </div>
          <button onclick="addSelectedParticipants()" class="modal-save-btn">Добавить выбранных</button>
        </div>
      </div>
      <div class="modal-footer">
        <button onclick="hideGroupInfoModal()" class="modal-cancel-btn">Закрыть</button>
        <button onclick="deleteCurrentGroup()" id="deleteGroupBtn" class="modal-delete-btn">Удалить беседу</button>
      </div>
    </div>
  </div>

  <!-- Модальное окно для управления сообщением -->
  <div id="messageOptionsModal" class="modal">
    <div class="modal-content small">
      <div class="modal-header">
        <h3>Действия с сообщением</h3>
        <button onclick="hideMessageOptions()" class="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <button onclick="deleteMessageForMe()" class="modal-option-btn">Удалить у себя</button>
        <button onclick="deleteMessageForEveryone()" id="deleteForEveryoneBtn" class="modal-option-btn delete">Удалить у всех</button>
      </div>
      <div class="modal-footer">
        <button onclick="hideMessageOptions()" class="modal-cancel-btn">Отмена</button>
      </div>
    </div>
  </div>

  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/messenger.js"></script>
</body>
</html>
