<script>
  (function () {
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') {
      // Моментально красим фон, чтобы не было белой вспышки
      document.documentElement.style.backgroundColor = '#121212';
      
      // Добавляем класс на body, как только он появится в DOM
      document.addEventListener('DOMContentLoaded', () => {
        document.body.classList.add('dark-theme');
      });
    }
  })();
</script>

  // Делаем функцию глобальной для JS файлов
  window.t = function(key) {
    const lang = localStorage.getItem('app_lang') || 'en';
    if (messengerTranslations[lang] && messengerTranslations[lang][key]) {
      return messengerTranslations[lang][key];
    }
    return key;
  };

  function applyLanguage(lang) {
    document.documentElement.lang = lang;
    const tObj = messengerTranslations[lang];
    if (!tObj) return;

    // Перевод текста
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (tObj[key]) el.innerHTML = tObj[key];
    });

    // Перевод плейсхолдеров (если добавите инпутам атрибут data-i18n-placeholder)
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
      const key = el.getAttribute('data-i18n-placeholder');
      if (tObj[key]) el.placeholder = tObj[key];
    });
  }

  document.addEventListener('DOMContentLoaded', () => {
    const savedLang = localStorage.getItem('app_lang') || 'en';
    applyLanguage(savedLang);
  });
