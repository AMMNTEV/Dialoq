<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="titleProfile">Мой профиль</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82f6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2'/><circle cx='12' cy='7' r='4'/></svg>">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/messenger.css">
  <link rel="stylesheet" href="css/profile.css">
  <link rel="stylesheet" href="css/dark-theme.css">
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
<script>
  (function () {
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') {
      document.documentElement.style.backgroundColor = '#121212';
      document.addEventListener('DOMContentLoaded', () => {
        document.body.classList.add('dark-theme');
      });
    }
  })();
</script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#121212">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TSA">
<link rel="apple-touch-icon" href="img/user.png">
</head>
<body>
  <div class="messenger-container">
    
    <!-- ===== ЛЕВАЯ ПАНЕЛЬ (Сайдбар) ===== -->
    <div class="nav-sidebar">
      <div class="nav-user-box">
        <div class="nav-user-info">
          <div class="nav-user-name" id="sidebarUserName">&nbsp;</div>
          <div class="nav-user-tag" id="sidebarUserTag">&nbsp;</div>
        </div>
        <div class="nav-user-avatar" id="sidebarUserAvatar" style="background: transparent;"></div>
      </div>

      <div class="nav-buttons">
        <a href="#" onclick="window.location.replace('profile.html'); return false;" class="nav-button">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span data-i18n="navProfile">Профиль</span>
        </a>
        <a href="#" onclick="goToMessenger(); return false;" class="nav-button">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span data-i18n="navMessenger">Мессенджер</span>
        </a>
        <a href="#" onclick="window.location.replace('settings.html'); return false;" class="nav-button">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span data-i18n="navSettings">Настройки</span>
        </a>
      </div>

      <div class="nav-divider"></div>

      <button onclick="logout()" class="nav-button logout-btn">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span data-i18n="navLogout">Выход</span>
      </button>
    </div>

    <!-- ===== КОНТЕНТ ПРОФИЛЯ ===== -->
    <div class="profile-container" style="flex: 1; overflow-y: auto; padding-bottom: 70px;">
      
      <!-- ПАРЯЩАЯ ШАПКА С КНОПКОЙ НАЗАД -->
      <div class="profile-header">
  <button onclick="window.location.href='messenger.html'" class="back-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5M12 19l-7-7 7-7"/>
    </svg>
  </button>
  <span id="headerUserTag" class="header-user-tag"></span>
</div>

      <div class="profile-two-columns">
        
        <!-- ИНСТА-БЛОК ПРОФИЛЯ -->
        <div class="insta-profile-header">
          <div class="insta-top-row">
            <!-- Слева: Аватарка -->
            <div class="insta-avatar-wrapper" onclick="document.getElementById('avatarInput').click()" style="cursor: pointer;">
              <div id="profileAvatar" class="insta-avatar">
                <!-- Аватар загрузится через JS -->
              </div>
              <div class="avatar-overlay">
                <svg viewBox="0 0 24 24" width="36" height="36" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                  <circle cx="12" cy="13" r="4"></circle>
                </svg>
              </div>
            </div>
            <input type="file" id="avatarInput" accept="image/*" style="display: none;">

            <!-- Справа: Имя, тег, счетчики и био -->
            <div class="insta-right-block">
              <h2 id="nickname" class="insta-nickname" data-i18n="loading">Загрузка...</h2>
              

              <!-- Счетчики -->
              <div class="insta-stats">
                <div class="stat-item">
                  <strong id="statPostsCount">0</strong>
                  <span data-i18n="statPosts">публикаций</span>
                </div>
                <div class="stat-item">
                  <strong id="statFollowersCount">0</strong>
                  <span data-i18n="statFollowers">подписчиков</span>
                </div>
                <div class="stat-item">
                  <strong id="statFollowingCount">0</strong>
                  <span data-i18n="statFollowing">подписок</span>
                </div>
              </div>

              <!-- Био профиля -->
              <div class="insta-bio" id="userBio"></div>
            </div>
          </div>

          <!-- Кнопки действий -->
          <div class="insta-actions" id="actionButtonsContainer">
            <button id="btnCreatePost" onclick="showCreatePostModal()" class="btn-primary" data-i18n="btnCreatePost">Создать пост</button>
            <button onclick="window.location.replace='edit.html'" id="btnEditProfile" class="btn-secondary" data-i18n="btnEditProfile">Редактировать профиль</button>
          </div>
        </div>

        <!-- НИЖНЯЯ ЧАСТЬ: ПОСТЫ -->
        <div class="profile-right">
          <div class="posts-header">
            <h2 id="userPostsTitle" data-i18n="userPosts">Посты пользователя</h2>
          </div>
          <div class="posts-container" id="userPostsContainer">
            <div class="skeleton-post"></div>
            <div class="skeleton-post"></div>
          </div>
        </div>

      </div>
    </div>

    <!-- Мобильная нижняя панель (Tab Bar) -->
    <nav class="mobile-bottom-nav" id="mobileBottomNav">
      <a href="#" onclick="goToMessenger(); return false;" class="nav-item">
        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </a>
      <a href="#" onclick="window.location.replace('settings.html'); return false;" class="nav-item">
        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </a>
      <a href="#" onclick="window.location.replace('profile.html'); return false;" class="nav-item active">
        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </a>
    </nav>

    <!-- Модальное окно для создания поста -->
    <div id="postModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3 data-i18n="createPostTitle">Создать новый пост</h3>
          <button onclick="hideCreatePostModal()" class="modal-close">&times;</button>
        </div>
        <div class="modal-body">
          <div id="postImagePreview" style="display: none; position: relative; margin-bottom: 12px; text-align: center;">
            <img id="previewImg" src="" style="max-width: 100%; max-height: 250px; border-radius: 12px; object-fit: contain; display: block; margin: 0 auto;" />
            <button onclick="removePostImage()" type="button" style="position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.6); color: white; border: none; border-radius: 50%; width: 28px; height: 28px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0;">
              <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
          </div>

          <textarea 
            id="postContent" 
            placeholder="Текст поста..." 
            rows="1" 
            oninput="autoResize(this)" 
            style="resize: none; overflow: hidden; width: 100%; min-height: 40px; box-sizing: border-box; font-family: inherit; padding: 10px; border-radius: 8px;">
          </textarea>

          <input type="file" id="postImageInput" accept="image/*" style="display: none;" onchange="handlePostImageSelect(event)">
          <button onclick="document.getElementById('postImageInput').click()" type="button" style="margin-top: 10px; background: transparent; border: 1px dashed #3b82f6; color: #3b82f6; padding: 8px 16px; border-radius: 12px; cursor: pointer; font-weight: 500; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            <span>Прикрепить фото</span>
          </button>
        </div>
        <div class="modal-footer">
          <button onclick="hideCreatePostModal()" class="modal-cancel-btn" data-i18n="cancelBtn">Отмена</button>
          <button onclick="createPost()" class="modal-save-btn" data-i18n="publishBtn">Опубликовать</button>
        </div>
      </div>
    </div>

  </div> <!-- Конец .messenger-container -->

  <!-- ЛОКАЛИЗАЦИЯ ПРОФИЛЯ -->
  <script>
    const profileTranslations = {
      en: {
        titleProfile: "My Profile",
        userPosts: "User's posts",
        navProfile: "Profile",
        navMessenger: "Messenger",
        navSettings: "Settings",
        navLogout: "Log out",
        loading: "Loading...",
        uploadAvatar: "Upload avatar",
        myPosts: "My posts",
        newPostBtn: "+ New post",
        createPostTitle: "Create new post",
        postPlaceholder: "What's new?",
        cancelBtn: "Cancel",
        publishBtn: "Publish",
        lblNickname: "Nickname:",
        lblTag: "Tag:",
        lblEmail: "Email:",
        notSpecified: "Not specified",
        saveChangesBtn: "Save changes",
        changesSaved: "Changes saved!",
        saveError: "Error saving changes",
        enterPostText: "Enter post text",
        postCreateError: "Error creating post",
        confirmDeletePost: "Delete this post?",
        postDeleteError: "Error deleting post",
        noPostsText: "You don't have any posts yet. Create the first one!",
        justNow: "Just now",
        saveBtn: "Save",
        noPostsYet: "This user has no posts yet.",
        btnFollow: "Follow",
        btnMessage: "Send message",
        btnCreatePost: "Create post",
        statPosts: "posts",
        statFollowers: "followers",
        statFollowing: "following",
        btnEditProfile: "Edit profile",
        bioMore: "...more",
	bioHide: "hide"
      },
      ru: {
        userPosts: "Посты пользователя",
        titleProfile: "Мой профиль",
        navProfile: "Профиль",
        navMessenger: "Мессенджер",
        navSettings: "Настройки",
        navLogout: "Выход",
        loading: "Загрузка...",
        uploadAvatar: "Загрузить аватарку",
        myPosts: "Мои посты",
        newPostBtn: "+ Новый пост",
        createPostTitle: "Создать новый пост",
        postPlaceholder: "Что у вас нового?",
        cancelBtn: "Отмена",
        publishBtn: "Опубликовать",
        lblNickname: "Никнейм:",
        lblTag: "Тег:",
        lblEmail: "Email:",
        notSpecified: "Не указан",
        saveChangesBtn: "Сохранить изменения",
        changesSaved: "Изменения сохранены!",
        saveError: "Ошибка при сохранении",
        enterPostText: "Введите текст поста",
        postCreateError: "Ошибка при создании поста",
        confirmDeletePost: "Удалить этот пост?",
        postDeleteError: "Ошибка при удалении поста",
        noPostsText: "У вас пока нет постов. Создайте первый!",
        justNow: "Только что",
        saveBtn: "Сохранить",
        noPostsYet: "Постов пока нет",
        btnFollow: "Подписаться",
        btnMessage: "Отправить сообщение",
        btnCreatePost: "Создать пост",
        statPosts: "публикаций",
        statFollowers: "подписчиков",
        statFollowing: "подписок",
        btnEditProfile: "Редактировать профиль",
        bioMore: "...ещё",
	bioHide: "cкрыть"
      }
    };

    window.t = function(key) {
      const lang = localStorage.getItem('app_lang') || 'en';
      if (profileTranslations[lang] && profileTranslations[lang][key]) {
        return profileTranslations[lang][key];
      }
      return key;
    };

    function applyProfileLanguage(lang) {
      document.documentElement.lang = lang;
      const tObj = profileTranslations[lang];
      if (!tObj) return;

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (tObj[key]) el.innerHTML = tObj[key];
      });

      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.getAttribute('data-i18n-placeholder');
        if (tObj[key]) el.placeholder = tObj[key];
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      const savedLang = localStorage.getItem('app_lang') || 'en';
      applyProfileLanguage(savedLang);
    });
  </script>

  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
