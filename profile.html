<script>
  (function () {
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') {
      document.documentElement.style.backgroundColor = '#121212';
      document.addEventListener('DOMContentLoaded', () => {
        document.body.classList.add('dark-theme');
      });
    }
  })();
</script>

    <div class="profile-container" style="flex: 1; overflow-y: auto; padding-bottom: 70px;">
      
      <!-- ПАРЯЩАЯ ШАПКА С КНОПКОЙ НАЗАД -->
      <div class="profile-header">
        <button onclick="window.history.back()" class="back-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>

      </div>

      <!-- ИСПРАВЛЕННЫЙ КОНТЕЙНЕР (Добавлено overflow: visible; height: auto; для прокрутки на ПК) -->
      <div class="profile-two-columns" style="flex-direction: column; align-items: center; gap: 0; overflow: visible; height: auto;">
        
        <!-- ВЕРХНЯЯ ЧАСТЬ: ИНФОРМАЦИЯ И КНОПКИ -->
        <div class="profile-left" style="width: 100%; max-width: 800px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 40px; padding-right: 0; margin-bottom: 30px; overflow: visible; height: auto;">
          
          <div class="profile-avatar-placeholder" style="margin-bottom: 0; text-align: center;">
            <div class="avatar-large" id="userAvatar" style="width: 150px; height: 150px; border-radius: 50%; font-size: 4rem; margin: 0 auto; display: flex; align-items: center; justify-content: center;">
              <!-- Аватар загрузится через JS -->
            </div>
          </div>
          
          <div class="profile-info-block" style="flex: 1; min-width: 300px; max-width: 400px; display: flex; flex-direction: column; justify-content: center;">
            <div class="profile-info" id="userInfo" style="margin: 0 0 20px 0; padding: 0; background: transparent; border: none; box-shadow: none;">
              <div class="skeleton-line"></div>
              <div class="skeleton-line"></div>
              <div class="skeleton-line"></div>
            </div>

            <!-- Кнопки взаимодействия -->
            <div class="profile-actions" style="display: flex; gap: 10px;">
              <button id="btnFollow" style="flex: 1; padding: 8px 16px; background: #3b82f6; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.95rem; transition: 0.2s;" data-i18n="btnFollow">
                Подписаться
              </button>
              <button id="btnMessage" style="flex: 1; padding: 8px 16px; background: #363636; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.95rem; transition: 0.2s;" data-i18n="btnMessage">
                Отправить сообщение
              </button>
            </div>
          </div>

        </div>
        
        <!-- НИЖНЯЯ ЧАСТЬ: ПОСТЫ -->
        <div class="profile-right" style="width: 100%; max-width: 900px; overflow: visible; height: auto; border-top: 1px solid rgba(128, 128, 128, 0.2); padding-top: 20px;">
          <div class="posts-header" style="display: flex; justify-content: flex-start; align-items: center; margin-bottom: 20px;">
            <h2 id="userPostsTitle" data-i18n="userPosts">Посты пользователя</h2>
          </div>
          <div class="posts-container" id="userPostsContainer" style="overflow: visible; height: auto; padding-right: 0;">
            <div class="skeleton-post"></div>
            <div class="skeleton-post"></div>
          </div>

  <!-- Модальное окно для создания поста -->
<div id="postModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 data-i18n="createPostTitle">Создать новый пост</h3>
      <button onclick="hideCreatePostModal()" class="modal-close">&times;</button>
    </div>
    <div class="modal-body">
      <!-- Предпросмотр прикрепленного изображения -->
      <div id="postImagePreview" style="display: none; position: relative; margin-bottom: 12px; text-align: center;">
        <img id="previewImg" src="" style="max-width: 100%; max-height: 250px; border-radius: 12px; object-fit: contain; display: block; margin: 0 auto;" />
        <button onclick="removePostImage()" type="button" style="position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.6); color: white; border: none; border-radius: 50%; width: 28px; height: 28px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0;">
  <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
</button>
      </div>

      <!-- Поле ввода текста -->
      <textarea 
  id="postContent" 
  placeholder="Текст поста..." 
  rows="1" 
  oninput="autoResize(this)" 
  style="resize: none; overflow: hidden; width: 100%; min-height: 40px; box-sizing: border-box; font-family: inherit; padding: 10px; border-radius: 8px;">
</textarea>

      <!-- Скрытый инпут и кнопка прикрепления фото -->
      <input type="file" id="postImageInput" accept="image/*" style="display: none;" onchange="handlePostImageSelect(event)">
      <button onclick="document.getElementById('postImageInput').click()" type="button" style="margin-top: 10px; background: transparent; border: 1px dashed #3b82f6; color: #3b82f6; padding: 8px 16px; border-radius: 12px; cursor: pointer; font-weight: 500; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;">
        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        <span>Прикрепить фото</span>
      </button>
    </div>
    <div class="modal-footer">
      <button onclick="hideCreatePostModal()" class="modal-cancel-btn" data-i18n="cancelBtn">Отмена</button>
      <button onclick="createPost()" class="modal-save-btn" data-i18n="publishBtn">Опубликовать</button>
    </div>
  </div>
</div>

    saveChangesBtn: "Сохранить изменения",
    changesSaved: "Изменения сохранены!",
    saveError: "Ошибка при сохранении",
    enterPostText: "Введите текст поста",
    postCreateError: "Ошибка при создании поста",
    confirmDeletePost: "Удалить этот пост?",
    postDeleteError: "Ошибка при удалении поста",
    noPostsText: "У вас пока нет постов. Создайте первый!",
    justNow: "Только что",
    saveBtn: "Сохранить",
    noPostsYet: "Постов пока нет",
    btnFollow: "Подписаться",
    btnMessage: "Отправить сообщение"
  }
};

window.t = function(key) {
  const lang = localStorage.getItem('app_lang') || 'en';
  if (profileTranslations[lang] && profileTranslations[lang][key]) {
    return profileTranslations[lang][key];
  }
  return key;
};

function applyProfileLanguage(lang) {
  document.documentElement.lang = lang;
  const tObj = profileTranslations[lang];
  if (!tObj) return;

  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (tObj[key]) el.innerHTML = tObj[key];
  });

  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    const key = el.getAttribute('data-i18n-placeholder');
    if (tObj[key]) el.placeholder = tObj[key];
  });
}

document.addEventListener('DOMContentLoaded', () => {
  const savedLang = localStorage.getItem('app_lang') || 'en';
  applyProfileLanguage(savedLang);
});
</script>
