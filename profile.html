<script>
  (function () {
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') {
      document.documentElement.style.backgroundColor = '#121212';
      document.addEventListener('DOMContentLoaded', () => {
        document.body.classList.add('dark-theme');
      });
    }
  })();
</script>

    <!-- ===== КОНТЕНТ ПРОФИЛЯ ===== -->
    <div class="profile-container" style="flex: 1; overflow-y: auto; padding-bottom: 70px;">
      
      <div class="profile-two-columns">
        <div class="profile-left">
          <div class="profile-card">
            <div class="profile-avatar-placeholder">
              <div class="avatar-large" id="profileAvatar">
                <div class="skeleton-circle"></div>
              </div>
              <input type="file" id="avatarInput" accept="image/png, image/jpeg, image/webp" style="display: none;">
              <button onclick="document.getElementById('avatarInput').click()" class="save-btn" style="width: auto; padding: 8px 16px; margin-top: 15px; font-size: 0.9rem;" data-i18n="uploadAvatar">
                Загрузить аватарку
              </button>
            </div>
            <div class="profile-info" id="profileInfo">
              <div class="skeleton-line"></div>
              <div class="skeleton-line"></div>
              <div class="skeleton-line"></div>
            </div>
          </div>
        </div>
        
        <div class="profile-right">
          <div class="posts-header">
            <h2 data-i18n="myPosts">Мои посты</h2>
            <button onclick="showCreatePostModal()" class="create-post-btn" data-i18n="newPostBtn">+ Новый пост</button>
          </div>
          <div class="posts-container" id="postsContainer">

            <div class="skeleton-post"></div>

  <!-- Модальное окно для создания поста -->
  <div id="postModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 data-i18n="createPostTitle">Создать новый пост</h3>
        <button onclick="hideCreatePostModal()" class="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <textarea id="postContent" data-i18n-placeholder="postPlaceholder" placeholder="Что у вас нового?" rows="5"></textarea>
      </div>
      <div class="modal-footer">
        <button onclick="hideCreatePostModal()" class="modal-cancel-btn" data-i18n="cancelBtn">Отмена</button>
        <button onclick="createPost()" class="modal-save-btn" data-i18n="publishBtn">Опубликовать</button>
      </div>
    </div>
  </div>



<!-- ЛОКАЛИЗАЦИЯ ПРОФИЛЯ -->
<script>
const profileTranslations = {
  en: {
    titleProfile: "My Profile",
    navProfile: "Profile",
    navMessenger: "Messenger",
    navSettings: "Settings",
    navLogout: "Log out",
    loading: "Loading...",
    uploadAvatar: "Upload avatar",
    myPosts: "My posts",
    newPostBtn: "+ New post",
    createPostTitle: "Create new post",
    postPlaceholder: "What's new?",
    cancelBtn: "Cancel",
    publishBtn: "Publish",
    lblNickname: "Nickname:",
    lblTag: "Tag:",
    lblEmail: "Email:",
    notSpecified: "Not specified",
    saveChangesBtn: "Save changes",
    changesSaved: "Changes saved!",
    saveError: "Error saving changes",
    enterPostText: "Enter post text",
    postCreateError: "Error creating post",
    confirmDeletePost: "Delete this post?",
    postDeleteError: "Error deleting post",
    noPostsText: "You don't have any posts yet. Create the first one!",
    justNow: "Just now"
  },
  ru: {
    titleProfile: "Мой профиль",
    navProfile: "Профиль",
    navMessenger: "Мессенджер",
    navSettings: "Настройки",
    navLogout: "Выход",
    loading: "Загрузка...",
    uploadAvatar: "Загрузить аватарку",
    myPosts: "Мои посты",
    newPostBtn: "+ Новый пост",
    createPostTitle: "Создать новый пост",
    postPlaceholder: "Что у вас нового?",
    cancelBtn: "Отмена",
    publishBtn: "Опубликовать",
    lblNickname: "Никнейм:",
    lblTag: "Тег:",
    lblEmail: "Email:",
    notSpecified: "Не указан",
    saveChangesBtn: "Сохранить изменения",
    changesSaved: "Изменения сохранены!",
    saveError: "Ошибка при сохранении",
    enterPostText: "Введите текст поста",
    postCreateError: "Ошибка при создании поста",
    confirmDeletePost: "Удалить этот пост?",
    postDeleteError: "Ошибка при удалении поста",
    noPostsText: "У вас пока нет постов. Создайте первый!",
    justNow: "Только что"
  }
};

window.t = function(key) {
  const lang = localStorage.getItem('app_lang') || 'en';
  if (profileTranslations[lang] && profileTranslations[lang][key]) {
    return profileTranslations[lang][key];
  }
  return key;
};

function applyProfileLanguage(lang) {
  document.documentElement.lang = lang;
  const tObj = profileTranslations[lang];
  if (!tObj) return;

  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (tObj[key]) el.innerHTML = tObj[key];
  });

  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    const key = el.getAttribute('data-i18n-placeholder');
    if (tObj[key]) el.placeholder = tObj[key];
  });
}

document.addEventListener('DOMContentLoaded', () => {
  const savedLang = localStorage.getItem('app_lang') || 'en';
  applyProfileLanguage(savedLang);
});
</script>
