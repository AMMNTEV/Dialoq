<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Reset</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82f6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4'/></svg>">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/auth.css">
  
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
<script>
  (function () {
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') {
      document.documentElement.style.backgroundColor = '#121212';
      document.addEventListener('DOMContentLoaded', () => {
        document.body.classList.add('dark-theme');
      });
    }
  })();
</script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#121212">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TSA">
<link rel="apple-touch-icon" href="img/user.png">
</head>
<body class="auth-page">
  <!-- Переключатель языков -->
  <div class="lang-switcher">
    <button onclick="setLanguage('en')">EN</button>
    <button onclick="setLanguage('ru')">RU</button>
  </div>

  <div class="auth-card">
    <h1 data-i18n="forgotTitle">Password Reset</h1>
    <p class="auth-subtitle" data-i18n="forgotSubtitle">Enter your email and we'll send you a link to reset your password</p>
    <form id="forgotPasswordForm">
      <div class="auth-input-group">
        <label data-i18n="emailLabel">Email</label>
        <input type="email" id="email" placeholder="your@email.com" required>
      </div>
      <button type="submit" class="auth-button" id="resetBtn" data-i18n="sendLinkBtn">Send Link</button>
    </form>
    <div class="auth-footer">
      <a href="index.html" class="back-link" data-i18n="backToLogin">← Back to Sign In</a>
    </div>
    <div id="message" class="message"></div>
  </div>

  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // ========== ЛОКАЛИЗАЦИЯ ==========
    const translations = {
      en: {
        forgotTitle: "Password Reset",
        forgotSubtitle: "Enter your email and we'll send you a link to reset your password",
        emailLabel: "Email",
        sendLinkBtn: "Send Link",
        backToLogin: "← Back to Sign In",
        sending: "Sending...",
        emailSent: "✅ Reset email sent to ",
        checkSpam: "Check your Spam folder if you don't receive the email",
        netError: "🌐 Internet connection issue. Please check your connection.",
        userNotFound: "📧 User with this email address was not found",
        invalidEmail: "📧 Invalid email format",
        tooManyReq: "⏳ Too many attempts. Please try again later.",
        defaultError: "❌ Error sending email. Please try again later."
      },
      ru: {
        forgotTitle: "Восстановление пароля",
        forgotSubtitle: "Введите email, и мы отправим ссылку для сброса пароля",
        emailLabel: "Email",
        sendLinkBtn: "Отправить ссылку",
        backToLogin: "← Вернуться ко входу",
        sending: "Отправка...",
        emailSent: "✅ Письмо отправлено на ",
        checkSpam: "Проверьте папку \"Спам\", если письмо не приходит",
        netError: "🌐 Проблема с интернетом. Проверьте подключение.",
        userNotFound: "📧 Пользователь с таким email не найден",
        invalidEmail: "📧 Некорректный формат email",
        tooManyReq: "⏳ Слишком много попыток. Попробуйте позже.",
        defaultError: "❌ Ошибка при отправке. Попробуйте позже."
      }
    };

    let currentLang = 'en';

    function setLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('app_lang', lang);
      document.documentElement.lang = lang;

      document.querySelectorAll('[data-i18n]').forEach(element => {
        const key = element.getAttribute('data-i18n');
        if (translations[lang] && translations[lang][key]) {
          element.textContent = translations[lang][key];
        }
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      const savedLang = localStorage.getItem('app_lang') || 'en';
      setLanguage(savedLang);
    });

    // ========== ОБРАБОТЧИК ФОРМЫ ==========
    document.getElementById('forgotPasswordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const resetBtn = document.getElementById('resetBtn');
      const messageDiv = document.getElementById('message');
      const t = translations[currentLang];

      resetBtn.disabled = true;
      resetBtn.textContent = t.sending;

      try {
        await resetPassword(email);
        messageDiv.innerHTML = `
          <div class="success">
            ${t.emailSent}${email}<br>
            <small>${t.checkSpam}</small>
          </div>
        `;
        document.getElementById('email').value = '';
      } catch (error) {
        console.error('Ошибка:', error);
        let errorMessage = '';
        if (error.code === 'auth/network-request-failed') {
          errorMessage = t.netError;
        } else if (error.code === 'auth/user-not-found') {
          errorMessage = t.userNotFound;
        } else if (error.code === 'auth/invalid-email') {
          errorMessage = t.invalidEmail;
        } else if (error.code === 'auth/too-many-requests') {
          errorMessage = t.tooManyReq;
        } else {
          errorMessage = t.defaultError;
        }
        messageDiv.innerHTML = `<div class="error">${errorMessage}</div>`;
      } finally {
        resetBtn.disabled = false;
        resetBtn.textContent = t.sendLinkBtn;
      }
    });
  </script>
</body>
</html>
