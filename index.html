<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход в аккаунт</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/auth.css">
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
<!-- Подключаем сам манифест (без первого слеша) -->
<link rel="manifest" href="manifest.json">

<!-- Цвет статус-бара для Android -->
<meta name="theme-color" content="#121212">

<!-- Указываем Safari, что это PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">

<!-- Настраиваем внешний вид статус-бара на iOS (black-translucent делает его прозрачным поверх приложения) -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!-- Название приложения на экране "Домой" для iOS (замени TSA на свое короткое название, если нужно) -->
<meta name="apple-mobile-web-app-title" content="TSA">

<!-- Иконка приложения для iOS (указали правильный путь к твоей картинке) -->
<link rel="apple-touch-icon" href="img/user.png">
</head>
<body class="auth-page">
  <div class="auth-card">
    <h1>Вход в аккаунт</h1>
    <form id="loginForm">
      <div class="auth-input-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="your@email.com" required>
      </div>
      <div class="auth-input-group">
        <label>Пароль</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <div class="auth-links">
        <a href="forgot-password.html" class="forgot-password-link">Забыли пароль?</a>
      </div>
      <button type="submit" class="auth-button" id="loginBtn">Войти</button>
      <div class="auth-divider">or</div>
      
      <button type="button" class="oauth-btn" id="googleLoginBtn">
        <svg width="20" height="20" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Continue with Google
      </button>
    </form>
    <div class="auth-footer">
      Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
    </div>
    <div id="message" class="message"></div>
  </div>

  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Обработка входа через Google
    document.getElementById('googleLoginBtn').addEventListener('click', async () => {
      const btn = document.getElementById('googleLoginBtn');
      const messageDiv = document.getElementById('message');
      btn.disabled = true;
      try {
        await continueWithGoogle();
        window.location.href = 'messenger.html'; // Успех -> идем в мессенджер
      } catch (error) {
        console.error('Ошибка Google:', error);
        let errorMsg = error.code === 'auth/popup-closed-by-user' ? 'Вход отменен' : 'Ошибка авторизации';
        messageDiv.innerHTML = `<div class="error">❌ ${errorMsg}</div>`;
        btn.disabled = false;
      }
    });
  
    // Проверяем, не залогинен ли уже пользователь
    onAuthStateChanged((user) => {
      if (user && user.emailVerified) {
        window.location.href = 'messenger.html';
      }
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const loginBtn = document.getElementById('loginBtn');
      const messageDiv = document.getElementById('message');

      loginBtn.disabled = true;
      loginBtn.textContent = 'Вход...';

      try {
        const userCredential = await login(email, password);
        const user = userCredential.user;
        if (user.emailVerified) {
          window.location.href = 'messenger.html';
        } else {
          messageDiv.innerHTML = `
            <div class="warning">
              <strong>ⓘ Аккаунт не активирован</strong>
              <p>На почту ${email} отправлено письмо с подтверждением.</p>
              <div style="margin: 10px 0;">
                <input type="password" id="resendPassword" placeholder="Введите пароль" style="width: 100%; padding: 8px; border: 1px solid #ffeeba; border-radius: 4px;">
              </div>
              <button onclick="resendVerification('${email}')" class="resend-btn">Отправить снова</button>
            </div>
          `;
          await auth.signOut();
        }
      } catch (error) {
        console.error('Ошибка входа:', error);
        let errorMessage = '';
        if (error.code === 'auth/network-request-failed') {
          errorMessage = '🌐 Проблема с интернетом. Проверьте подключение и попробуйте снова.';
        } else if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
          errorMessage = '❌ Неверный email или пароль';
        } else if (error.code === 'auth/invalid-email') {
          errorMessage = '📧 Некорректный формат email';
        } else if (error.code === 'auth/too-many-requests') {
          errorMessage = '⏳ Слишком много попыток. Подождите несколько минут и попробуйте снова.';
        } else if (error.code === 'auth/user-disabled') {
          errorMessage = '🚫 Аккаунт заблокирован';
        } else {
          errorMessage = '❌ Ошибка при входе. Попробуйте позже.';
        }
        messageDiv.innerHTML = `<div class="error">${errorMessage}</div>`;
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Войти';
      }
    });

    window.resendVerification = async (email) => {
      const password = document.getElementById('resendPassword')?.value;
      if (!password) { alert('Введите пароль'); return; }
      const messageDiv = document.getElementById('message');
      messageDiv.innerHTML = '<div class="loading">Отправка...</div>';
      try {
        await login(email, password);
        const user = auth.currentUser;
        if (user) {
          await sendVerificationEmail();
          await auth.signOut();
          messageDiv.innerHTML = `
            <div class="success">
              ✅ Письмо отправлено повторно на ${email}!<br>
              <small>Проверьте папку "Спам"</small>
            </div>
          `;
        } else {
          throw new Error('User not found');
        }
      } catch (error) {
        console.error('Ошибка отправки:', error);
        let errorMessage = '';
        if (error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
          errorMessage = '❌ Неверный email или пароль';
        } else if (error.code === 'auth/too-many-requests') {
          errorMessage = '⏳ Слишком много попыток. Подождите несколько минут и попробуйте снова.';
        } else if (error.code === 'auth/network-request-failed') {
          errorMessage = '🌐 Проблема с интернетом';
        } else {
          errorMessage = '❌ Ошибка при отправке. Попробуйте позже.';
        }
        messageDiv.innerHTML = `<div class="error">${errorMessage}</div>`;
      }
    };
  </script>
</body>
</html>
