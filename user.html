<script>
  (function () {
    const savedTheme = localStorage.getItem('theme');

      document.documentElement.style.backgroundColor = '#121212';
      document.addEventListener('DOMContentLoaded', () => {
        document.body.classList.add('dark-theme');
      });
    }
  })();
</script>

<!-- ЛОКАЛИЗАЦИЯ -->
<script>
const userTranslations = {
  en: {
    titleUserProfile: "User Profile",
    navProfile: "Profile",
    navMessenger: "Messenger",
    navSettings: "Settings",
    navLogout: "Log out",
    loading: "Loading...",
    loadingProfile: "Loading profile...",
    lblNickname: "Nickname:",
    lblTag: "Tag:",
    notSpecified: "Not specified",
    userPosts: "User posts",
    loadingPosts: "Loading posts...",
    noUserPosts: "This user has no posts yet.",
    unknownDate: "Unknown date",
    justNow: "Just now",
    userNotFound: "User not found",
    backToMessenger: "Back to messenger",
    profileLoadError: "Error loading profile",
    postsLoadError: "Error loading posts",
    indexRequired: "Index required for posts query"
  },
  ru: {
    titleUserProfile: "Профиль пользователя",
    navProfile: "Профиль",
    navMessenger: "Мессенджер",
    navSettings: "Настройки",
    navLogout: "Выход",
    loading: "Загрузка...",
    loadingProfile: "Загрузка профиля...",
    lblNickname: "Никнейм:",
    lblTag: "Тег:",
    notSpecified: "Не указан",
    userPosts: "Посты пользователя",
    loadingPosts: "Загрузка постов...",
    noUserPosts: "У этого пользователя пока нет постов.",
    unknownDate: "Неизвестная дата",
    justNow: "Только что",
    userNotFound: "Пользователь не найден",
    backToMessenger: "Вернуться в мессенджер",
    profileLoadError: "Ошибка загрузки профиля",
    postsLoadError: "Ошибка загрузки постов",
    indexRequired: "Требуется индекс для запроса постов"
  }
};

// ЭТА ФУНКЦИЯ РЕШАЕТ ПРОБЛЕМУ "t is not defined"
window.t = function(key) {
  const savedLang = localStorage.getItem('app_lang') || 'en';
  return userTranslations[savedLang] && userTranslations[savedLang][key] ? userTranslations[savedLang][key] : key;
};

function applyUserLanguage(lang) {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (userTranslations[lang] && userTranslations[lang][key]) {
      el.innerHTML = userTranslations[lang][key];
    }
  });
}

document.addEventListener('DOMContentLoaded', () => {
  const savedLang = localStorage.getItem('app_lang') || 'en';
  applyUserLanguage(savedLang);
});
</script>
