<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/auth.css">
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
  <style>
    /* Стили для переключателя методов регистрации */
    .auth-toggle {
      display: flex;
      margin-bottom: 20px;
      background: #f1f1f1;
      border-radius: 8px;
      overflow: hidden;
    }
    .auth-toggle button {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      cursor: pointer;
      font-weight: bold;
      color: #666;
      transition: 0.3s;
    }
    .auth-toggle button.active {
      background: #667eea;
      color: white;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body class="auth-page">
  <div class="auth-card">
    <h1>Регистрация</h1>
    <p class="auth-subtitle">Создайте аккаунт чтобы начать общение</p>
    
    <!-- Переключатель способа регистрации -->
    <div class="auth-toggle">
      <button id="btnEmail" class="active" onclick="switchMethod('email')">По Email</button>
      <button id="btnPhone" onclick="switchMethod('phone')">По Телефону</button>
    </div>

    <!-- Основная форма регистрации -->
    <form id="registerForm">
      <div class="auth-input-group">
        <label>Никнейм</label>
        <input type="text" id="nickname" placeholder="Например: Anna" required>
      </div>
      <div class="auth-input-group">
        <label>Тег</label>
        <div class="tag-input-wrapper">
          <span>@</span>
          <input type="text" id="tag" placeholder="username" required
                 oninput="handleTagInput(this); checkTagUnique(this)"
                 onkeydown="preventAtSymbolDeletion(event, this)">
        </div>
        <div id="tagStatus" class="tag-status"></div>
      </div>

      <!-- Поля для Email -->
      <div id="emailFields">
        <div class="auth-input-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="your@email.com">
        </div>
        <div class="auth-input-group">
          <label>Пароль</label>
          <input type="password" id="password" placeholder="Минимум 6 символов" minlength="6">
        </div>
      </div>

      <!-- Поля для Телефона -->
      <div id="phoneFields" class="hidden">
        <div class="auth-input-group">
          <label>Номер телефона</label>
          <input type="tel" id="phone" placeholder="+7 999 123 45 67">
        </div>
      </div>

      <button type="submit" class="auth-button" id="registerBtn" disabled>Зарегистрироваться</button>
    </form>

    <!-- Форма ввода кода из СМС (изначально скрыта) -->
    <form id="smsForm" class="hidden">
      <p style="text-align: center; margin-bottom: 15px;">Мы отправили код на ваш номер.</p>
      <div class="auth-input-group">
        <label>СМС Код</label>
        <input type="text" id="smsCode" placeholder="123456" required>
      </div>
      <button type="submit" class="auth-button" id="confirmSmsBtn">Подтвердить код</button>
    </form>

    <div class="auth-footer">
      Уже есть аккаунт? <a href="index.html">Войти</a>
    </div>
    <div id="message" class="message"></div>
  </div>

  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // ========== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ==========
    let tagCheckTimeout = null;
    let isTagAvailable = false;
    let currentTagValue = '';
    let currentMethod = 'email'; // 'email' или 'phone'
    let confirmationResultObj = null;

    // Инициализируем капчу при загрузке страницы
    window.onload = () => {
      setupRecaptcha('recaptcha-container', 'registerBtn');
    };

    // ========== ЛОГИКА ИНТЕРФЕЙСА ==========
    function switchMethod(method) {
      currentMethod = method;
      document.getElementById('btnEmail').classList.toggle('active', method === 'email');
      document.getElementById('btnPhone').classList.toggle('active', method === 'phone');
      
      document.getElementById('emailFields').classList.toggle('hidden', method !== 'email');
      document.getElementById('phoneFields').classList.toggle('hidden', method !== 'phone');

      // Управляем обязательностью полей в зависимости от метода
      document.getElementById('email').required = (method === 'email');
      document.getElementById('password').required = (method === 'email');
      document.getElementById('phone').required = (method === 'phone');
    }

    // Утилиты для тега
    function handleTagInput(input) {
      let value = input.value.replace(/@/g, '').slice(0, 20);
      value = value.replace(/[^a-zA-Z0-9_]/g, '');
      input.value = value;
    }

    function preventAtSymbolDeletion(event, input) {
      if (event.key === 'Backspace' && input.selectionStart === 0 && input.selectionEnd === 0) {
        event.preventDefault();
      }
      if (event.key === 'Delete' && input.selectionStart === 0 && input.selectionEnd === 1) {
        event.preventDefault();
      }
      if (event.key === 'ArrowLeft' && input.selectionStart === 0 && input.selectionEnd === 0) {
        event.preventDefault();
      }
    }

    async function checkTagUnique(input) {
      const tagValue = input.value.trim();
      const tagStatus = document.getElementById('tagStatus');
      const registerBtn = document.getElementById('registerBtn');

      if (!tagValue) {
        tagStatus.innerHTML = '';
        tagStatus.className = 'tag-status';
        isTagAvailable = false;
        registerBtn.disabled = true;
        return;
      }
      if (tagValue.length < 3) {
        tagStatus.innerHTML = '⚠️ Минимум 3 символа';
        tagStatus.className = 'tag-status unavailable';
        isTagAvailable = false;
        registerBtn.disabled = true;
        return;
      }

      tagStatus.innerHTML = '⏳ Проверка...';
      tagStatus.className = 'tag-status loading';
      if (tagCheckTimeout) clearTimeout(tagCheckTimeout);
      currentTagValue = tagValue;

      tagCheckTimeout = setTimeout(async () => {
        if (currentTagValue !== tagValue) return;
        try {
          const fullTag = '@' + tagValue;
          const snapshot = await db.collection('users').where('tag', '==', fullTag).get();

          if (snapshot.empty) {
            tagStatus.innerHTML = '✅ Тег доступен';
            tagStatus.className = 'tag-status available';
            isTagAvailable = true;
            registerBtn.disabled = false;
          } else {
            tagStatus.innerHTML = '❌ Этот тег уже занят';
            tagStatus.className = 'tag-status unavailable';
            isTagAvailable = false;
            registerBtn.disabled = true;
          }
        } catch (error) {
          console.error('Ошибка проверки тега:', error);
          tagStatus.innerHTML = '❌ Ошибка проверки';
          tagStatus.className = 'tag-status unavailable';
          isTagAvailable = false;
          registerBtn.disabled = true;
        }
      }, 500);
    }

    // ========== ОТПРАВКА ОСНОВНОЙ ФОРМЫ ==========
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      if (!isTagAvailable) {
        alert('Пожалуйста, выберите другой тег');
        return;
      }

      const nickname = document.getElementById('nickname').value.trim();
      const tag = '@' + document.getElementById('tag').value.trim();
      const registerBtn = document.getElementById('registerBtn');
      const messageDiv = document.getElementById('message');

      registerBtn.disabled = true;
      registerBtn.textContent = 'Обработка...';
      messageDiv.innerHTML = '';

      try {
        if (currentMethod === 'email') {
          // ----- РЕГИСТРАЦИЯ ПО EMAIL -----
          const email = document.getElementById('email').value.trim();
          const password = document.getElementById('password').value;
          
          await register(email, password, nickname, tag);

          messageDiv.innerHTML = `
            <div class="success">
              <h3>✅ Регистрация успешна!</h3>
              <p>На почту ${email} отправлено письмо с подтверждением.</p>
              <p><a href="index.html" style="color: #667eea;">Перейти ко входу →</a></p>
            </div>
          `;
          document.getElementById('registerForm').style.display = 'none';

        } else if (currentMethod === 'phone') {
          // ----- РЕГИСТРАЦИЯ ПО ТЕЛЕФОНУ (Шаг 1: Отправка СМС) -----
          const phone = document.getElementById('phone').value.trim();
          const appVerifier = window.recaptchaVerifier;

          confirmationResultObj = await sendSMS(phone, appVerifier);
          
          // Скрываем основную форму, показываем форму ввода СМС
          document.getElementById('registerForm').classList.add('hidden');
          document.getElementById('smsForm').classList.remove('hidden');
          document.querySelector('.auth-toggle').classList.add('hidden');
        }

      } catch (error) {
        console.error('Ошибка:', error);
        registerBtn.disabled = false;
        registerBtn.textContent = 'Зарегистрироваться';
        
        let errorMessage = '❌ Ошибка при регистрации. Проверьте данные.';
        if (error.code === 'auth/email-already-in-use') errorMessage = '❌ Этот email уже зарегистрирован.';
        if (error.code === 'auth/invalid-phone-number') errorMessage = '❌ Неверный формат номера телефона (используйте международный формат, например +7...)';
        if (error.code === 'auth/too-many-requests') errorMessage = '⏳ Слишком много попыток. Подождите.';
        
        messageDiv.innerHTML = `<div class="error">${errorMessage}</div>`;
      }
    });

    // ========== ПОДТВЕРЖДЕНИЕ СМС И СОЗДАНИЕ ПРОФИЛЯ ==========
    document.getElementById('smsForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const smsCode = document.getElementById('smsCode').value.trim();
      const confirmBtn = document.getElementById('confirmSmsBtn');
      const messageDiv = document.getElementById('message');
      
      confirmBtn.disabled = true;
      confirmBtn.textContent = 'Проверка...';

      try {
        // Подтверждаем СМС код (Firebase автоматически авторизует пользователя)
        const result = await confirmationResultObj.confirm(smsCode);
        const user = result.user;

        // Данные профиля
        const nickname = document.getElementById('nickname').value.trim();
        const tag = '@' + document.getElementById('tag').value.trim();

        // 1. Обновляем профиль Firebase
        await user.updateProfile({ displayName: nickname + '|' + tag });

        // 2. Создаем документ в Firestore
        await db.collection('users').doc(user.uid).set({
          nickname: nickname,
          tag: tag,
          phone: user.phoneNumber, // сохраняем номер вместо email
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        messageDiv.innerHTML = `
          <div class="success">
            <h3>✅ Регистрация успешна!</h3>
            <p>Ваш профиль создан.</p>
            <p><a href="messenger.html" style="color: #667eea;">Перейти в мессенджер →</a></p>
          </div>
        `;
        document.getElementById('smsForm').style.display = 'none';

      } catch (error) {
        console.error('Ошибка подтверждения СМС:', error);
        confirmBtn.disabled = false;
        confirmBtn.textContent = 'Подтвердить код';
        messageDiv.innerHTML = `<div class="error">❌ Неверный код из СМС</div>`;
      }
    });
  </script>
</body>
</html>
