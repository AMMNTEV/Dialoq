<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <script>
  (function () {
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') {
      document.documentElement.style.backgroundColor = '#0a0c10';
      
      document.addEventListener('DOMContentLoaded', () => {
        document.body.classList.add('dark-theme');
      });
    }
  })();
</script>
  <title>Настройки</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚙️</text></svg>">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/messenger.css"> 
  <link rel="stylesheet" href="css/settings.css">
  <link rel="stylesheet" href="css/dark-theme.css">
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#0a0c10">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TSA">
<link rel="apple-touch-icon" href="img/user.png">
</head>
<body class="settings-page">
  <div class="messenger-container">
    
    <!-- ===== ЛЕВАЯ ПАНЕЛЬ (Сайдбар для ПК) ===== -->
    <div class="nav-sidebar">
      <div class="nav-user-box">
        <div class="nav-user-info">
          <div class="nav-user-name" id="sidebarUserName">Загрузка...</div>
          <div class="nav-user-tag" id="sidebarUserTag">@загрузка</div>
        </div>
        <div class="nav-user-avatar" id="sidebarUserAvatar"></div>
      </div>

      <div class="nav-buttons">
        <a href="profile.html" class="nav-button">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Профиль
        </a>
        <a href="messenger.html" class="nav-button">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          Мессенджер
        </a>
        <a href="settings.html" class="nav-button active">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Настройки
        </a>
      </div>

      <div class="nav-divider"></div>

      <button onclick="logout()" class="nav-button logout-btn">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Выход
      </button>
    </div>

    <!-- ===== КОНТЕНТ НАСТРОЕК ===== -->
    <div class="settings-container" style="flex: 1; overflow-y: auto; padding-bottom: 70px;">
      
      
      <div class="settings-content">
        <div class="user-card" id="userCard">
          <div class="user-avatar" id="userAvatar">?</div>
          <div class="user-info">
            <div class="user-name" id="userName">Загрузка...</div>
            <div class="user-tag" id="userTag">@loading</div>
          </div>
        </div>

        <div class="settings-section">
          <div class="settings-item" onclick="window.location.href='profile.html'">
            <div class="settings-item-icon">👤</div>
            <div class="settings-item-info">
              <div class="settings-item-title">Профиль</div>
              <div class="settings-item-desc">Изменить имя, тег и другую информацию</div>
            </div>
            <div class="settings-item-arrow">→</div>
          </div>
          <div class="settings-item" onclick="window.location.href='change-password.html'">
            <div class="settings-item-icon">🔒</div>
            <div class="settings-item-info">
              <div class="settings-item-title">Пароль</div>
              <div class="settings-item-desc">Изменить пароль аккаунта</div>
            </div>
            <div class="settings-item-arrow">→</div>
          </div>
          <div class="settings-item">
            <div class="settings-item-icon">🌙</div>
            <div class="settings-item-info">
              <div class="settings-item-title">Темная тема</div>
              <div class="settings-item-desc">Использовать темную тему оформления</div>
            </div>
            <label class="switch">
              <input type="checkbox" id="darkThemeToggle" onchange="toggleTheme(this.checked)">
              <span class="slider"></span>
            </label>
          </div>
        </div>

        <div class="settings-section">
          <div class="settings-item" onclick="window.location.href='help.html'">
            <div class="settings-item-icon">❓</div>
            <div class="settings-item-info">
              <div class="settings-item-title">Помощь / FAQ</div>
              <div class="settings-item-desc">Ответы на частые вопросы</div>
            </div>
            <div class="settings-item-arrow">→</div>
          </div>
          <div class="settings-item" onclick="window.location.href='about.html'">
            <div class="settings-item-icon">ℹ️</div>
            <div class="settings-item-info">
              <div class="settings-item-title">О приложении</div>
              <div class="settings-item-desc">Версия и информация</div>
            </div>
            <div class="settings-item-arrow">→</div>
          </div>
        </div>

        <!-- ===== КНОПКИ ===== -->
        <div class="settings-section" style="display: flex; flex-direction: column; gap: 10px;">
          <!-- Выйти — используем класс settings-btn (серая) -->
          <button onclick="logout()" class="settings-btn">Выйти из аккаунта</button>
          <!-- Удалить — используем класс settings-danger-btn (красная) -->
          <button onclick="deleteAccount()" class="settings-danger-btn">Удалить аккаунт</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== Мобильная нижняя панель (Tab Bar) ===== -->
  <nav class="mobile-bottom-nav" id="mobileBottomNav">
    <a href="messenger.html" class="nav-item">
      <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    </a>
    <a href="settings.html" class="nav-item active">
      <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </a>
    <a href="profile.html" class="nav-item">
      <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </a>
  </nav>

  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/settings.js"></script>
</body>
</html>
